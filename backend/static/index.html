<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>划重点 · 期末复习范围编译器</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --line:#242833; --text:#e6e8ee;
    --dim:#9aa3b2; --accent:#5b8cff; --ok:#3ecf8e; --warn:#f5a524; --bad:#f2555a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  header{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;
         align-items:baseline;gap:12px}
  header h1{font-size:17px;margin:0;font-weight:600}
  header span{color:var(--dim);font-size:12px}
  main{display:grid;grid-template-columns:minmax(320px,420px) 1fr;gap:16px;padding:16px}
  @media(max-width:900px){main{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
  label{display:block;color:var(--dim);font-size:12px;margin:10px 0 6px}
  textarea,select,button,input[type=file]{font:inherit;color:var(--text);
      background:#12151b;border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
  textarea{min-height:180px;resize:vertical;font-family:ui-monospace,Consolas,monospace;font-size:12px}
  button{cursor:pointer;background:var(--accent);border-color:transparent;color:#fff;font-weight:600}
  button:disabled{opacity:.5;cursor:default}
  button.ghost{background:#12151b;border-color:var(--line);color:var(--text);font-weight:400}
  .row{display:flex;gap:8px}
  .row>*{flex:1}
  .hint{color:var(--dim);font-size:12px;margin-top:8px}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;
         border:1px solid var(--line)}
  .badge.ok{color:var(--ok);border-color:#1f4d3a}
  .badge.warn{color:var(--warn);border-color:#4d3f1f}
  .tabs{display:flex;gap:8px;margin:12px 0}
  .tab{flex:1;text-align:center;padding:8px;border:1px solid var(--line);border-radius:8px;
       cursor:pointer;background:#12151b;color:var(--dim)}
  .tab.active{border-color:var(--accent);color:var(--text);background:#1a2233}
  .tab b{display:block;font-size:18px;color:var(--text)}
  ul.kps{list-style:none;padding:0;margin:0}
  ul.kps li{padding:8px 10px;border:1px solid var(--line);border-radius:8px;
            margin-bottom:6px;background:#12151b}
  .kpname{font-weight:600}
  .meta{color:var(--dim);font-size:12px;margin-top:2px}
  .new{color:var(--accent);font-size:12px;font-weight:600}
  .tree{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--dim);
        max-height:220px;overflow:auto;white-space:pre}
  .err{color:var(--bad);font-size:13px;margin-top:8px}
</style>
</head>
<body>
<header>
  <h1>划重点</h1>
  <span>拍一张目录，得到「考 50 / 60 / 80 分分别该学什么」</span>
</header>

<main>
  <section class="panel">
    <label>① 上传目录照片（或直接粘贴识别文本）</label>
    <input type="file" id="file" accept="image/*" />
    <div class="hint" id="ocrHint">上传后自动调用本机 Windows OCR 识别</div>

    <label>② 识别文本（可以手改，改错字比让后端猜更靠谱）</label>
    <textarea id="text" placeholder="例如：&#10;2.1 二分法&#10;2.1.1 二分法原理&#10;2.2 不动点迭代法"></textarea>

    <div class="row">
      <div>
        <label>③ 学校档位</label>
        <select id="profile">
          <option value="normal">一档 · 普通本科</option>
          <option value="211">二档 · 211</option>
          <option value="985">三档 · 985</option>
        </select>
      </div>
    </div>

    <label style="margin-top:12px">④ 生成</label>
    <button id="go">生成三档复习清单</button>
    <button id="demo" class="ghost" style="margin-top:8px">载入示例（数值分析目录）</button>
    <div class="err" id="err"></div>
  </section>

  <section class="panel" id="result">
    <div style="color:var(--dim)">结果会显示在这里。</div>
  </section>
</main>

<script>
const SAMPLE = `1.2.3 有效数字
1.3 稳定性概念与病态问题
1.3.1 数值稳定性
1.3.2 病态问题与条件数
第2章 非线性方程的数值求解
2.1 二分法
2.1.1 二分法原理
2.1.2 二分法的计算步骤
2.2 不动点迭代法
2.2.1 不动点迭代
2.2.2 不动点迭代法的收敛性
2.3 牛顿—割线法
2.3.1 牛顿迭代公式及其几何意义
2.3.2 牛顿迭代法的收敛性
2.3.3 割线法
2.3.4 牛顿法求解代数方程
2.4 迭代加速与改善`;

const $ = (id) => document.getElementById(id);
let current = null;

$("demo").onclick = () => { $("text").value = SAMPLE; };

$("file").onchange = async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  $("ocrHint").textContent = "识别中…";
  const fd = new FormData();
  fd.append("file", f);
  try {
    const r = await fetch("/api/ocr", { method: "POST", body: fd });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || "OCR 失败");
    $("text").value = j.text;
    $("ocrHint").textContent = `识别完成：${j.chars} 字`;
  } catch (err) {
    $("ocrHint").textContent = "识别失败，可以手动粘贴文本";
    $("err").textContent = err.message;
  }
};

$("go").onclick = async () => {
  const text = $("text").value.trim();
  if (!text) { $("err").textContent = "请先上传照片或粘贴目录文本"; return; }
  $("err").textContent = "";
  $("go").disabled = true;
  $("go").textContent = "分析中…";
  try {
    const r = await fetch("/api/analyze", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text, profile: $("profile").value }),
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || "分析失败");
    current = j;
    render(j);
  } catch (err) {
    $("err").textContent = err.message;
  } finally {
    $("go").disabled = false;
    $("go").textContent = "生成三档复习清单";
  }
};

function treeText(nodes, d = 0) {
  return nodes.map(n =>
    "  ".repeat(d) + `[${n.no}] ${n.title}` + "\n" + treeText(n.children || [], d + 1)
  ).join("");
}

function render(data) {
  const c = data.course;
  const courseLine = c.status === "confident"
    ? `<span class="badge ok">科目：${c.course.name}</span>
       <span class="hint">置信度 ${c.course.confidence}｜证据：${c.course.evidence.join("、")}</span>`
    : `<span class="badge warn">科目未确定</span>
       <span class="hint">${c.reason}｜候选：${c.candidates.map(x => x.name).join("、") || "无"}</span>`;

  const cov = data.tree.coverage;
  const dg = data.diagnostics || {};
  const covBadge = cov >= 0.4
    ? `<span class="badge ok">目录识别 ${(cov * 100).toFixed(0)}%</span>`
    : `<span class="badge warn">目录识别仅 ${(cov * 100).toFixed(0)}%，建议手改文本</span>`;
  const diagLine = `<div class="hint">读到 ${dg.lines || 0} 行，其中 ${dg.matched || 0} 行像目录
      ${dg.hint ? `｜<span style="color:var(--warn)">${dg.hint}</span>` : ""}</div>`;

  $("result").innerHTML = `
    <div>${courseLine}</div>
    <div style="margin-top:8px">${covBadge}
      <span class="hint">共 ${data.kps.length} 个知识点</span></div>
    ${diagLine}
    <div class="tabs" id="tabs"></div>
    <div id="list"></div>
    <details style="margin-top:12px">
      <summary style="cursor:pointer;color:var(--dim)">查看解析出的章节树</summary>
      <div class="tree">${treeText(data.tree.nodes)}</div>
    </details>
    <details style="margin-top:8px">
      <summary style="cursor:pointer;color:var(--dim)">被排除的知识点（${data.tiers.skipped.length}）</summary>
      <ul class="kps" style="margin-top:8px">
        ${data.tiers.skipped.map(s => `<li><span class="kpname">${s.name}</span>
          <div class="meta">${s.reason}</div></li>`).join("")}
      </ul>
    </details>`;

  const order = ["50", "60", "80"];
  $("tabs").innerHTML = order.map(t => {
    const d = data.tiers.tiers[t];
    return `<div class="tab" data-t="${t}">
      <b>${d.count}</b>${t} 分档 · ${d.minutes} 分钟</div>`;
  }).join("");

  const show = (t) => {
    document.querySelectorAll(".tab").forEach(el =>
      el.classList.toggle("active", el.dataset.t === t));
    const d = data.tiers.tiers[t];
    $("list").innerHTML = d.items.length === 0
      ? `<div class="hint">这一档没有知识点，说明门槛高于所有点的分数。</div>`
      : `<ul class="kps">${d.items.map(i => `
          <li>
            <span class="kpname">${i.name}</span>
            ${i.new_in_this_tier ? `<span class="new">＋本档新增</span>` : ""}
            <div class="meta">${i.type}｜深度 ${i.depth}｜约 ${i.cost_min} 分钟｜
              分数 ${i.score}（${i.basis}）</div>
          </li>`).join("")}</ul>`;
  };

  document.querySelectorAll(".tab").forEach(el =>
    el.onclick = () => show(el.dataset.t));
  show("50");
}
</script>
</body>
</html>
